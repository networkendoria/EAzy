name: build
on: [push, pull_request, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: checkout repository
        uses: actions/checkout@v6
      - name: validate gradle wrapper
        uses: gradle/actions/wrapper-validation@v6
      - name: setup jdk
        uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'microsoft'
      - name: make gradle wrapper executable
        run: chmod +x ./gradlew
      - name: build
        run: ./gradlew build
      - name: name the jar EAzy.jar
        run: cp "$(ls build/libs/*.jar | grep -v -- '-sources.jar' | head -1)" EAzy.jar
      - name: capture build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: EAzy
          path: EAzy.jar
      - name: publish download link (release "latest")
        if: github.ref == 'refs/heads/mc-1.21.11' && github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest-1.21.11 --cleanup-tag --yes || true
          gh release create latest-1.21.11 EAzy.jar --title "EAzy 1.21.11 (son derleme)" --notes "Commit ${GITHUB_SHA::7}" --target "$GITHUB_SHA"
