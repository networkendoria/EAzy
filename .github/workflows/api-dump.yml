name: api-dump
on:
  workflow_dispatch:
    inputs:
      classes:
        description: "Boşlukla ayrılmış tam sınıf adları (javap ile imzaları yazdırılır)"
        required: true
      bytecode:
        description: "true ise javap -c (bytecode) de yazdırılır"
        required: false
        default: "false"

jobs:
  dump:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'microsoft'
      - run: chmod +x ./gradlew
      - name: resolve minecraft jars
        run: ./gradlew compileClientJava --no-daemon -q
      - name: javap
        env:
          CLASSES: ${{ inputs.classes }}
          BYTECODE: ${{ inputs.bytecode }}
        run: |
          JARS=$(find ~/.gradle "$GITHUB_WORKSPACE/.gradle" -name '*.jar' 2>/dev/null | grep -i -E 'minecraft|gametest|command-api' | grep -v -E 'sources|fabric-loader' || true)
          echo "=== jar listesi"; echo "$JARS"
          for j in $JARS; do
            case "$j" in *command-api*) echo "=== command sınıfları: $j"; jar tf "$j" | grep -E 'client/command/v2/.*\.class$' ;; esac
            case "$j" in *gametest*) echo "=== gametest sınıfları: $j"; jar tf "$j" | grep -E '^net/fabricmc/fabric/api/client/gametest/v1/.*\.class$' | sed 's/\.class$//; s#/#.#g' ;; esac
          done
          for c in $CLASSES; do
            echo; echo "################ $c"
            FOUND=0
            for j in $JARS; do
              FLAGS="-p"; [ "$BYTECODE" = "true" ] && FLAGS="-p -c"
              if javap $FLAGS -cp "$j" "$c" 2>/dev/null; then FOUND=1; break; fi
            done
            if [ $FOUND = 0 ]; then echo "BULUNAMADI"; fi
          done
