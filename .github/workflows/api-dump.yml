name: api-dump
on:
  workflow_dispatch:
    inputs:
      classes:
        description: "Boşlukla ayrılmış tam sınıf adları (javap ile imzaları yazdırılır)"
        required: true

jobs:
  dump:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'microsoft'
      - run: chmod +x ./gradlew
      - name: resolve minecraft jars
        run: ./gradlew compileClientJava --no-daemon -q
      - name: javap
        env:
          CLASSES: ${{ inputs.classes }}
        run: |
          JARS=$(find ~/.gradle -name '*.jar' | grep -i 'minecraft' | grep -v -E 'sources|fabric-loader|loom' || true)
          echo "=== jar listesi"; echo "$JARS"
          for c in $CLASSES; do
            echo; echo "################ $c"
            FOUND=0
            for j in $JARS; do
              if javap -p -cp "$j" "$c" 2>/dev/null; then FOUND=1; break; fi
            done
            [ $FOUND = 0 ] && echo "BULUNAMADI"
          done
